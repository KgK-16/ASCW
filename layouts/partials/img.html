{{- /* a picture (src = site path, e.g. /ASCW/notes/x.webp) with its size, so the page does not jump while it loads;
   loaded when scrolled near */ -}}
{{- $f := path.Join "static" (strings.TrimPrefix (relURL "") .src) -}}
<img src="{{ .src }}" alt="" loading="lazy" decoding="async"{{ if and (findRE `(?i)\.(jpe?g|png|gif|webp)$` $f) (fileExists $f) }}{{ with imageConfig $f }} width="{{ .Width }}" height="{{ .Height }}"{{ end }}{{ end }}>

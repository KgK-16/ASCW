<style>
section{width:100%;padding:0;border:0;position:relative;overflow:hidden}

@media(max-width:700px){aside{top:auto;width:auto;right:0;height:38%;border:0;border-top:1px solid #6665c04d;transform:translateY(101%)}}
</style>

<div id="m"><div id="c"><img id="im" alt=""><svg id="sv" viewBox="0 0 3840 2160"></svg></div></div>
</section></main>
<script>
var U="{{ "" | relURL }}",W=3840,H=2160,x=0,y=0,k=1,lv=-1,P={},R={},sel,tap=0,mv;
function fit(){return Math.min(m.clientWidth/W,m.clientHeight/H)}

x=w<m.clientWidth?(m.clientWidth-w)/2:Math.min(0,Math.max(m.clientWidth-w,x));

c.classList.toggle("t",!!a);c.style.transform="translate("+x+"px,"+y+"px) scale("+k+")";c.style.setProperty("--k",k);

function pick(i){if(sel)sel.classList.remove("s");sel=i?document.getElementById("r"+i):null;
if(sel){sel.classList.add("s");pt.textContent=R[i].name;px.textContent=R[i].text}p.classList.toggle("o",!!sel)}

{{ partial "top" . }}
<style>
section{padding:0;position:relative;overflow:hidden}
#m{flex:1;background:#1b2738}
.z{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border:1px solid #6665c04d;z-index:9}
.z a{width:30px;height:30px;line-height:30px;font-size:18px;text-align:center;background:#020206;cursor:pointer}
.o{pointer-events:none}
.o path{fill:transparent;pointer-events:all;cursor:pointer;vector-effect:non-scaling-stroke}
.o path:hover{fill:#e8e8e02e}
.o path.s{fill:#6665c059;stroke:#e8e8e0;stroke-width:1.5px}
.o text{fill:#e8e8e0;font-family:A;text-anchor:middle;dominant-baseline:central;opacity:.85}
aside{position:absolute;left:0;top:0;bottom:0;width:min(280px,100%);padding:24px 20px;background:#020206f2;border-right:1px solid #6665c04d;z-index:9;display:flex;flex-direction:column;justify-content:center;transform:translateX(-101%);transition:transform .25s}
aside.o1{transform:none}
aside h1{font-size:32px}
aside>a{position:absolute;right:14px;top:10px;font-size:20px;cursor:pointer}
@media(max-width:700px){aside{top:auto;width:auto;right:0;height:38%;border:0;border-top:1px solid #6665c04d;transform:translateY(101%)}}
</style>
<div class="z"><a id="zi">+</a><a id="zo">−</a></div>
<aside id="p"><a id="pc">×</a><h1 id="pt"></h1><hr><i id="px"></i></aside>
<div id="m"></div>
</section></main>
<script src="{{ "osd/openseadragon.min.js" | relURL }}"></script>
<script>
var v=OpenSeadragon({id:"m",showNavigationControl:false,zoomInButton:"zi",zoomOutButton:"zo",maxZoomPixelRatio:2,gestureSettingsMouse:{clickToZoom:false},gestureSettingsTouch:{clickToZoom:false},
tileSources:{width:3840,height:2160,tileSize:256,minLevel:8,maxLevel:12,getTileUrl:function(l,x,y){return"{{ "tiles/" | relURL }}"+(l-8)+"/"+x+"/"+y+".webp"}}}),
p=document.getElementById("p"),sel;
function pick(i){if(sel)sel.classList.remove("s");sel=i==null?null:document.getElementById("r"+i);
if(sel)sel.classList.add("s");p.classList.toggle("o1",!!sel);
if(sel){pt.textContent=R[i].name;px.textContent=R[i].text}}
var R={};
fetch("{{ "regions.json" | relURL }}").then(function(r){return r.json()}).then(function(a){
var s='<svg viewBox="0 0 3840 2160" style="display:block;width:100%;height:100%">';
a.forEach(function(r){R[r.id]=r;s+='<path id="r'+r.id+'" data-i="'+r.id+'" fill-rule="evenodd" d="'+r.d+'"/>'});
a.forEach(function(r){s+='<text x="'+r.x+'" y="'+r.y+'" font-size="'+r.s+'">'+r.name+'</text>'});
var d=document.createElement("div");d.className="o";d.innerHTML=s+'</svg>';
v.addOverlay(d,new OpenSeadragon.Rect(0,0,1,2160/3840))});
v.addHandler("canvas-click",function(e){if(e.quick)pick(e.originalTarget.dataset&&e.originalTarget.dataset.i||null)});
document.getElementById("pc").onclick=function(){pick(null)};
document.onkeydown=function(e){if(e.key=="Escape")pick(null)}
</script>

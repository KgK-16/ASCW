{{ partial "top" . }}
<style>
main{background:none}main::before{display:none}
section{width:100%;padding:0;border:0;position:relative;overflow:hidden}
#m{flex:1;position:relative;overflow:hidden;background:#152139}
#m,#g{touch-action:none;cursor:grab}
#m,#g,.z{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#g{position:absolute;inset:0;display:none;background:#04040a}
#g canvas{width:100%;height:100%;display:block}
.g #m{visibility:hidden}.g #g{display:block}.g #cd{display:none}
#c{position:absolute;left:0;top:0;width:4096px;height:2048px;transform-origin:0 0}
#c.t{transition:transform .25s}
#c>*{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#c.mv{will-change:transform}#c.mv #sv>path{pointer-events:none}
#ov{display:none}.on #ov{display:block}
#sv>path{fill:#e8e8e0;fill-opacity:0;pointer-events:visibleFill;cursor:pointer}#sv>path:hover{fill-opacity:.12}.on #sv>path:hover{fill:var(--c);fill-opacity:.2}
#hl path{animation:hf .25s}@keyframes hf{from{opacity:0}}
#hl .dm{fill:#04040a;fill-opacity:.5}
#hl .gw,#hl .ol{fill:none;stroke:#e8e8e0;stroke-linejoin:round;vector-effect:non-scaling-stroke}#hl .gw{stroke-width:7px;stroke-opacity:.22}#hl .ol{stroke-width:2px}
.gr{fill:none;stroke:#000;stroke-opacity:.35;vector-effect:non-scaling-stroke}.gr .e{stroke-opacity:.7}
#c text{paint-order:stroke;stroke:#000b;stroke-width:calc(3px/var(--k));stroke-linejoin:round;fill:#e8e8e0;font-family:A;text-transform:uppercase;text-anchor:middle;dominant-baseline:central}
#c .lb text{text-anchor:start;stroke-width:.14em}
#gx{position:absolute;left:0;top:0;pointer-events:none;z-index:2}#gx span{position:absolute;left:0;top:0;white-space:nowrap;font:400 12px "Exo 2",sans-serif;letter-spacing:1px;color:#e8e8e0b3;text-shadow:0 0 3px #000,0 0 2px #000}
.t #gx span,#mw.t~#gx span{transition:transform .25s}
#mw{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}#mw g{pointer-events:auto;cursor:pointer}#mw g.z,#mw g[hidden]{display:none}#mw g.s path{fill:#e8b04a}#mw.t g{transition:transform .25s}
#mw path{fill:#e8e8e0;stroke:#000;stroke-width:1.5px;stroke-linejoin:round}
#mw text{font-family:Play,sans-serif;font-weight:400;font-size:15px;letter-spacing:1px;text-transform:uppercase;paint-order:stroke;stroke:#000b;stroke-width:3px;stroke-linejoin:round;fill:#e8e8e0;dominant-baseline:central}
.z{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border:1px solid #6665c04d;z-index:9}
.z button{position:relative;display:block;cursor:pointer;color:#e8e8e0a6}.z button:hover{color:#e8e8e0}
.z button{width:30px;height:30px;line-height:30px;font-size:18px;text-align:center;background:#020206}
@media(pointer:coarse){.z button{width:44px;height:44px;line-height:44px}}
.z button:nth-child(-n+2){font-size:12px;letter-spacing:1px}
/* labels next to the buttons: on hover / focus, and for a few seconds on touch screens */
.z button::after{content:attr(aria-label);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;font:400 12px/1 "Exo 2",sans-serif;letter-spacing:.5px;text-transform:none;color:#e8e8e0;background:#020206f2;border:1px solid #6665c04d;padding:6px 8px;opacity:0;pointer-events:none;transition:opacity .15s}
.z button:hover::after,.z button:focus-visible::after,.z.hint button::after{opacity:1}
.z i{display:inline-block;width:12px;height:12px;border:1px solid #e8e8e0a6;vertical-align:-1px}.z .on i{background:linear-gradient(135deg,#5e0a22 33%,#1c4690 33% 66%,#b77d2b 66%)}
aside{position:absolute;left:0;top:0;bottom:0;width:min(280px,100%);padding:24px 20px;background:#020206f2;border-right:1px solid #6665c04d;z-index:9;display:flex;flex-direction:column;justify-content:center;transform:translateX(-101%);transition:transform .25s}
aside.o{transform:none}
aside h1{font-size:32px}#px{white-space:pre-line;max-height:45vh;overflow:auto}
aside>button{position:absolute;right:6px;top:2px;font-size:20px;width:40px;height:40px;cursor:pointer;color:#e8e8e0a6}
#cd{position:absolute;right:12px;bottom:12px;z-index:9;padding:6px 10px;color:#e8e8e0;text-shadow:0 0 3px #000,0 0 3px #000;font:400 14px/1.35 "Exo 2",sans-serif;letter-spacing:1px;text-align:right;cursor:pointer;-webkit-user-select:text;user-select:text}
#tl{position:absolute;inset:0;z-index:12;background:#020206f2;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;flex-direction:column;text-shadow:0 0 3px #000}
#tl.o{display:flex}#tl.o~.z,#tl.o~#cd{visibility:hidden}
#xt{position:absolute;right:8px;top:4px;font-size:28px;z-index:2;width:44px;height:44px;cursor:pointer;color:#e8e8e0a6}
#ty{font:min(72px,14vw)/1 A;letter-spacing:.05em;text-align:center;padding-top:22px}
#tw{flex:1;overflow:auto hidden}
#tz{position:relative;height:100%}
#tz .f{position:absolute;width:200px;padding-left:8px;text-align:left;display:flex;flex-direction:column;cursor:pointer;opacity:.45;transition:opacity .2s}#tz .a{opacity:1}
/* event lines stay under every label: line on ::before, texts on an opaque plate above it */
#tz .f::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid #e8e8e099;z-index:0}#tz .f b,#tz .f span{position:relative;z-index:1;align-self:flex-start;background:#020206;padding:1px 4px 1px 0;box-shadow:-8px 0 #020206}
#tz .u{bottom:50%}#tz .d{top:50%;justify-content:flex-end}
#tz b{font:400 15px "Exo 2",sans-serif;letter-spacing:2px}#tz span{font:italic 300 13px/1.3 Inter,sans-serif;text-transform:none;letter-spacing:.3px;color:#e8e8e0e6}
#tz .t{position:absolute;top:50%;width:1px;height:6px;background:#e8e8e0b3}#tz .l{height:10px}#tz .n{position:absolute;top:calc(50% + 14px);transform:translateX(-50%);font:400 11px "Exo 2",sans-serif;letter-spacing:1px;color:#e8e8e0b3}
#tr{position:absolute;top:50%;transform:translateY(-50%);height:24px;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:none}
#tr::-webkit-slider-runnable-track{height:1px;background:#e8e8e0b3}#tr::-moz-range-track{height:1px;background:#e8e8e0b3}
#tr::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#e8e8e0;border:1px solid #000}#tr::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#e8e8e0;border:1px solid #000}
@media(max-width:700px){aside{top:auto;width:auto;right:0;height:38%;border:0;border-top:1px solid #6665c04d;transform:translateY(101%)}aside.o~#cd{bottom:calc(38% + 12px)}}
#ld{position:absolute;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;background:#04040a99;pointer-events:none}#ld[hidden]{display:none}
#ld i{width:44px;height:44px;border-radius:50%;border:2px solid #6665c04d;border-top-color:#e8e8e0;animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
<div id="tl" role="dialog" aria-modal="true"><button type="button" id="xt"{{ with index hugo.Data.text "tip_close" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}>×</button><div id="ty"></div><div id="tw"><div id="tz"><input id="tr" type="range"></div></div></div>
<div class="z"><button type="button" id="zg"{{ with index hugo.Data.text "tip_3d" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}>3D</button><button type="button" id="zt"{{ with index hugo.Data.text "tip_tl" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}></button><button type="button" id="zc"{{ with index hugo.Data.text "tip_col" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}><i></i></button><button type="button" id="zi"{{ with index hugo.Data.text "tip_in" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}>+</button><button type="button" id="zo"{{ with index hugo.Data.text "tip_out" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}>−</button></div>
<aside id="p"><button type="button" id="pc"{{ with index hugo.Data.text "tip_close" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}>×</button><h1 id="pt"></h1><hr><i id="px"></i></aside>
<button type="button" id="cd"{{ with index hugo.Data.text "tip_copy" }} data-ten="{{ .en }}" data-tru="{{ .ru }}" title="{{ .en }}" aria-label="{{ .en }}"{{ end }}>—</button>
<div id="ld" class="ld" hidden role="status"><i></i></div>
<div id="g"></div>
<div id="m"><div id="c"><img id="im" alt="" decoding="async"><canvas id="ov" width="4096" height="2048"></canvas><svg id="sv" viewBox="0 0 4096 2048"></svg><img id="bi" alt="" decoding="async"><svg id="hl" viewBox="0 0 4096 2048"></svg><svg id="sl" viewBox="0 0 4096 2048"></svg></div><svg id="mw"></svg><div id="gx"></div></div>
</section></main>
{{ with resources.Get "map.js" | js.Build (dict "minify" true "target" "es2020") -}}
<script>var U="{{ "" | relURL }}",V={{ (resources.Get "map.json").Content | safeJS }},MK={{ (resources.Get "markers.json").Content | safeJS }},EV={{ (resources.Get "events.json").Content | safeJS }},COU={{ (resources.Get "countries.json").Content | safeJS }};{{ .Content | safeJS }}</script>
{{- end }}
